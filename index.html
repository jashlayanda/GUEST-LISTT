
<!DOCTYPE html>
<html>
<head>
    <title>Guest List Checker</title>
</head>
<body>

    <h1>Guest List Checker</h1>

    <script>
        var guestList = ["Jashla", "Jojo", "Gideon", "Elizabeth", "Caleb", "Jethro"];

        var guestName = prompt("What is your name?");

        if (guestList.includes(guestName)) {
            alert("Welcome! You are on the guest list.");
        } else {
            alert("Sorry, maybe next time.");
        }
    </script>

</body>
</html>
